const NIVEIS = [['nenhum','Sem acesso'],['ver','Só ver'],['editar','Ver e editar']];
function resumoAreas(u){
  const out = AREAS.map(([k,l])=>{ const n = (u.permissoes||{})[k]; return n && n!=='nenhum' ? l+(n==='editar'?' (edita)':' (vê)') : null; }).filter(Boolean);
  return out.length ? out.join(' · ') : '<span class="faint">nenhuma área liberada</span>';
}
function renderAcessos(){
  const lista = S.usuarios.slice().sort((a,b)=>(a.criadoEm||'').localeCompare(b.criadoEm||''));
  const nomeUn = id => { const u = byId(S.units, id); return u ? esc(u.name) : '<span class="faint">(unidade removida)</span>'; };
  const grupos = [['pendente','Aguardando aprovação','pill-warn'],['aprovado','Aprovados','pill-ok'],['recusado','Recusados','pill-muted']];
  const html = grupos.map(([st, titulo, cls])=>{
    const itens = lista.filter(u=>(u.status||'pendente')===st);
    if(!itens.length && st!=='pendente') return '';
    const linhas = itens.map(u=>`<tr${st==='pendente'?' style="background:var(--warn-soft);"':''}>
      <td><div style="font-weight:500;">${esc(u.nome||'(sem nome)')}</div><div class="faint">${esc(u.email||'')}</div></td>
      <td><span class="pill ${cls}">${titulo}</span></td>
      <td>${(u.unidades||[]).length ? (u.unidades||[]).map(nomeUn).join(', ') : '<span class="faint">nenhuma</span>'}</td>
      <td style="font-size:13px;">${resumoAreas(u)}</td>
      <td><button class="btn btn-sm ${st==='pendente'?'btn-primary':''}" data-acesso="${u.id}">${st==='pendente'?'Revisar':'Editar'}</button></td>
    </tr>`).join('');
    return `<section class="panel"><div class="panel-head">${titulo} <span class="muted" style="font-weight:400;font-size:13px;">${itens.length}</span></div>
      <table><thead><tr><th>Técnico</th><th>Situação</th><th>Unidades</th><th>Áreas</th><th></th></tr></thead><tbody>${linhas || '<tr><td colspan="5" class="faint" style="padding:16px;">Nenhum cadastro aguardando aprovação.</td></tr>'}</tbody></table></section>`;
  }).join('');
  return `<div class="muted" style="font-size:13px;margin-bottom:16px;max-width:720px;">O técnico cria a conta pela tela de login e fica aguardando aqui. Ao aprovar, você escolhe as unidades dele e o nível de acesso em cada área. Quem não está aprovado não vê nenhum dado.</div>${html}`;
}
function bindAcessos(){
  document.querySelectorAll('[data-acesso]').forEach(b=>b.addEventListener('click', ()=>openAcessoModal(byId(S.usuarios, b.dataset.acesso))));
}
function openAcessoModal(u){
  if(!u) return;
  const unidades = S.units.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  openModal('Acesso de '+esc(u.nome||u.email||'técnico'), `
    <div class="muted" style="font-size:13px;">${esc(u.email||'')}</div>
    <div class="field"><label for="acStatus">Situação</label>
      <select id="acStatus"><option value="pendente">Aguardando aprovação</option><option value="aprovado">Aprovado</option><option value="recusado">Recusado</option></select></div>
    <div class="field"><label>Unidades vinculadas</label>
      <div style="max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;">
        ${unidades.length ? unidades.map(x=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--text);font-size:13px;"><input type="checkbox" data-ac-un="${x.id}" ${(u.unidades||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('') : '<span class="faint">Nenhuma unidade cadastrada.</span>'}
      </div></div>
    <div class="field"><label>O que ele pode fazer em cada área</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
        <button type="button" class="btn btn-sm" data-ac-preset="ver">Tudo: só ver</button>
        <button type="button" class="btn btn-sm" data-ac-preset="editar">Tudo: ver e editar</button>
        <button type="button" class="btn btn-sm" data-ac-preset="nenhum">Limpar</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;">
        ${AREAS.map(([k,l])=>`<div><label for="ac_${k}" style="font-size:12px;">${l}</label><select id="ac_${k}" data-ac-area="${k}">${NIVEIS.map(([v,t])=>`<option value="${v}" ${((u.permissoes||{})[k]||'nenhum')===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}
      </div></div>
  `, `<button class="btn btn-danger" id="acDel" style="margin-right:auto;">Remover cadastro</button><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);
  document.getElementById('acStatus').value = u.status || 'pendente';
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-ac-preset]').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-ac-area]').forEach(sel=>{ sel.value = b.dataset.acPreset; });
  }));
  document.getElementById('acDel').addEventListener('click', async ()=>{
    if(!confirm('Remover o cadastro de '+(u.nome||u.email)+'? Se ele entrar de novo, aparecerá como novo pedido.')) return;
    if(await dbDelete('usuarios', u.id)){ closeModal(); toast('Cadastro removido.', 'ok'); }
  });
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const status = document.getElementById('acStatus').value;
    const un = [...document.querySelectorAll('[data-ac-un]')].filter(c=>c.checked).map(c=>c.dataset.acUn);
    const perm = {};
    document.querySelectorAll('[data-ac-area]').forEach(sel=>{ if(sel.value!=='nenhum') perm[sel.dataset.acArea] = sel.value; });
    if(status==='aprovado' && !un.length && !confirm('Nenhuma unidade vinculada: o técnico não verá dados. Salvar assim mesmo?')) return;
    if(status==='aprovado' && !Object.keys(perm).length && !confirm('Nenhuma área liberada: o técnico só verá o painel vazio. Salvar assim mesmo?')) return;
    if(await dbUpdate('usuarios', u.id, {status, unidades: un, permissoes: perm})){ closeModal(); toast('Acesso salvo.', 'ok'); }
  });
}

/* ---------------- Visão geral (unit) ---------------- */
function raPillCls(ra){
  if(ra.level==='danger') return 'pill-danger';
  if(ra.label==='Em andamento') return 'pill-info';
  return 'pill-warn';
}

function renderVisaoGeral(unit){
  const am = activeMandate(unit.id);
  const alerts = computeAllAlerts().filter(a=>a.unit && a.unit.id===unit.id);
  const members = am ? mandateMembers(am.id) : [];
  const tech = unitTechnicians(unit.id)[0] || null;

  let mandateCard;
  if(!am){
    mandateCard = `<section class="card"><div class="empty" style="padding:24px;">Nenhum mandato cadastrado.<br><br><button class="btn btn-primary" id="btnNewMandateQuick">${ico('plus')}Cadastrar mandato</button></div></section>`;
  } else {
    const ra = mandateRenewalAlert(am);
    const total = daysBetween(am.startDate, am.endDate);
    const elapsed = daysBetween(am.startDate, todayISO());
    const pct = total>0 ? Math.max(0, Math.min(100, Math.round(elapsed/total*100))) : 0;
    const left = daysBetween(todayISO(), am.endDate);
    const hasRenewal = am.renewal && am.renewal.stages && am.renewal.stages.length;
    let banner = '';
    if(ra && ra.invalid){
      banner = `<div class="banner danger" style="margin-top:20px;"><div class="b-text"><div class="b-title">Datas do mandato inválidas</div><div style="font-size:13px;margin-top:2px;">O início está depois do fim. Corrija as datas para o sistema calcular os prazos.</div></div><button class="btn btn-primary" data-fix-mandate="${am.id}">Corrigir mandato</button></div>`;
    } else if(hasRenewal && am.renewal.status!=='concluido'){
      banner = `<div class="banner warn" style="margin-top:20px;"><div class="b-text"><div class="b-title">Renovação em andamento</div><div style="font-size:13px;margin-top:2px;">Acompanhe as etapas do processo eleitoral até a posse da nova CIPA.</div></div><button class="btn btn-primary" data-renewal-action="${am.id}">Gerenciar cronograma</button></div>`;
    } else if(ra){
      const start60 = fmtDate(addDaysISO(am.endDate, -PROCESS_LEAD_DAYS));
      banner = `<div class="banner ${ra.level==='danger'?'danger':'warn'}" style="margin-top:20px;"><div class="b-text"><div class="b-title">${ra.level==='danger'?'Prazo para iniciar a renovação vencido':'Hora de preparar a renovação'}</div><div style="font-size:13px;margin-top:2px;">O cronograma automático da NR-05 começa em ${start60} e inclui ${INSCRICAO_DIAS} dias de inscrição.</div></div><button class="btn btn-primary" data-renewal-action="${am.id}">Iniciar renovação</button></div>`;
    }
    mandateCard = `<section class="card" style="padding:24px;">
      <div class="row">
        <div><div class="lbl-s">Mandato atual</div><div style="font-size:20px;font-weight:600;">${fmtDate(am.startDate)} – ${fmtDate(am.endDate)}</div></div>
        ${unitStatusPill(unit.id)}
      </div>
      ${total>0 ? `<div class="progress" style="margin-top:18px;"><div style="width:${pct}%;"></div></div>
      <div class="row muted" style="font-size:13px;margin-top:8px;"><span>${pct}% do mandato decorrido</span><span>${left>=0?'faltam '+left+' dia(s)':'encerrado há '+Math.abs(left)+' dia(s)'}</span></div>` : ''}
      ${banner}
    </section>`;
  }

  const membersPanel = am ? `<section class="panel">
    <div class="panel-head">Membros do mandato atual <button class="btn btn-sm" data-open-unit-tab="${unit.id}|membros">Ver todos</button></div>
    <table><thead><tr><th>Nome</th><th>Função</th><th>Representação</th><th>Estabilidade</th></tr></thead><tbody>
    ${members.length ? members.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role||'—')}</td><td>${esc(m.representationType||'—')}</td><td>${stabilityCellHtml(m, am)}</td></tr>`).join('') : `<tr><td colspan="4" class="faint" style="padding:16px;">Nenhum membro cadastrado neste mandato.</td></tr>`}
    </tbody></table>
  </section>` : '';

  return `<div class="two-col">
    <div class="main-col">${mandateCard}${membersPanel}</div>
    <div class="side-col">
      <section class="card">
        <h3>Dados da unidade</h3>
        <div class="lbl-s">CNPJ</div><div style="margin-bottom:14px;">${unit.cnpj? esc(unit.cnpj) : '<span class="faint">não informado</span>'}</div>
        <div class="lbl-s">Técnico responsável</div>
        ${tech ? `<div style="font-weight:500;">${esc(tech.name)}</div><div class="muted" style="font-size:13px;">${esc(tech.type||'')}${tech.registrationNumber?' · '+esc(tech.registrationNumber):''}</div>${tech.contact?`<div class="muted" style="font-size:13px;">${esc(tech.contact)}</div>`:''}`
               : `<div class="faint">Nenhum definido. Use "Editar unidade" para cadastrar.</div>`}
      </section>
      <section class="panel">
        <div class="panel-head">Alertas desta unidade</div>
        <div style="padding:0 20px 16px;">
        ${alerts.length ? alerts.slice(0,5).map(a=>alertBoxHtml(a)).join('') + (alerts.length>5?`<div class="faint">+ ${alerts.length-5} outro(s), veja a aba Alertas</div>`:'') : `<span class="pill pill-ok">Sem alertas pendentes</span>`}
        </div>
      </section>
    </div>
  </div>`;
}

function alertBoxHtml(a){
  const cls = a.level==='danger'?'danger':'warn';
  const icon = ico(a.level==='danger'?'erro':'alerta');
  let action = '';
  if(a.type==='renewal' && a.mandate){
    if(a.invalid){
      action = `<button class="btn btn-sm" data-fix-mandate="${a.mandate.id}" style="margin-left:auto; flex-shrink:0;">Corrigir mandato</button>`;
    } else {
      const hasSchedule = a.mandate.renewal && a.mandate.renewal.stages && a.mandate.renewal.stages.length;
      action = `<button class="btn btn-sm" data-renewal-action="${a.mandate.id}" style="margin-left:auto; flex-shrink:0;">${hasSchedule?'Ver/editar cronograma':'Iniciar renovação'}</button>`;
    }
  }
  return `<div class="alert-box ${cls}"><span>${icon}</span><div class="txt">${a.text}</div>${action}</div>`;
}

function renewalSummaryHtml(renewal){
  const {done, total} = renewalProgress(renewal);
  const status = renewalStatusInfo(renewal);
  const rows = renewal.stages.map(s=>{
    const dateText = s.type==='single' ? fmtDate(s.date) : (fmtDate(s.startDate)+' – '+fmtDate(s.endDate));
    return `<div class="row" style="padding:3px 0; font-size:12.5px;"><span style="display:inline-flex;align-items:center;gap:8px;"><span class="dot ${s.done?'done':''}" style="width:18px;height:18px;border-width:1.5px;">${s.done?ico('check','style="width:11px;height:11px;stroke-width:3"'):''}</span>${esc(s.label)}</span><span class="muted">${dateText}</span></div>`;
  }).join('');
  return `<div style="margin-top:10px; padding:10px 12px; background:var(--surface-2); border-radius:8px;">
    <div class="row" style="margin-bottom:4px;">
      <span class="faint">Cronograma de renovação (${renewal.mode==='auto'?'automático':'manual'}) — ${done}/${total} etapas</span>
      <span class="pill ${status.level==='ok'?'pill-ok':status.level==='danger'?'pill-danger':'pill-warn'}">${status.text}</span>
    </div>
    ${rows}
  </div>`;
}

/* ---------------- Dimensionamento (tela) ---------------- */
function renderDimResult(){
  const config = effectiveDimConfig();
  const grau = S._dimGrau || 1;
  const raw = S._dimNumEmp;
  const n = (raw!=='' && raw!=null) ? Number(raw) : null;
  if(n==null || isNaN(n) || n<=0){
    return `<div class="faint" style="padding:10px 0;">Informe o número de colaboradores para calcular.</div>`;
  }
  const res = calcDimensionamento(config, grau, n);
  if(!res) return '';
  if(res.notRequired){
    return `<div class="alert-box warn" style="margin-top:10px;"><span>ℹ️</span><div class="txt">Faixa "${esc(res.bracketLabel)}" para o grau de risco ${grau}: o Quadro I não exige CIPA formal nesta faixa. Verifique a necessidade de designado, conforme a NR-05.</div></div>`;
  }
  const total = (res.efetivos+res.suplentes)*2;
  return `
  <div class="grid" style="margin-top:12px;">
    <div class="stat"><div class="num">${res.efetivos}</div><div class="label">Efetivos — eleitos (empregados)</div></div>
    <div class="stat"><div class="num">${res.suplentes}</div><div class="label">Suplentes — eleitos (empregados)</div></div>
    <div class="stat"><div class="num">${res.efetivos}</div><div class="label">Efetivos — a indicar (empregador)</div></div>
    <div class="stat"><div class="num">${res.suplentes}</div><div class="label">Suplentes — a indicar (empregador)</div></div>
    <div class="stat"><div class="num">${total}</div><div class="label">Total de membros da CIPA</div></div>
  </div>
  <div class="faint" style="margin-top:8px;">Faixa aplicada: ${esc(res.bracketLabel)} · Grau de risco ${grau}</div>`;
}

function renderDimensionamento(){
  const config = effectiveDimConfig();
  S._dimBuffer = JSON.parse(JSON.stringify(config));
  const grau = S._dimGrau || 1;

  function tableHtml(){
    const head = '<tr><th>Grau</th><th></th>' + config.brackets.map(b=>`<th>${b}</th>`).join('') + '<th>+2.500 acima de 10k</th></tr>';
    let body = '';
    [1,2,3,4].forEach(g=>{
      ['efetivos','suplentes'].forEach(tipo=>{
        const arr = config.matrix[g][tipo];
        const extraVal = config.extra[g][tipo];
        body += `<tr>
          <td>${tipo==='efetivos'?g:''}</td>
          <td class="faint">${tipo==='efetivos'?'Efetivos':'Suplentes'}</td>
          ${arr.map((v,idx)=>`<td><input type="number" min="0" style="width:46px; padding:4px;" data-dim-grau="${g}" data-dim-tipo="${tipo}" data-dim-idx="${idx}" value="${v==null?'':v}"></td>`).join('')}
          <td><input type="number" min="0" style="width:46px; padding:4px;" data-dim-grau="${g}" data-dim-tipo="${tipo}" data-dim-extra="1" value="${extraVal==null?'':extraVal}"></td>
        </tr>`;
      });
    });
    return `<table style="font-size:11.5px;"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  return `
  <div class="card">
    <h3>Calculadora de dimensionamento (Quadro I — NR-05)</h3>
    <div class="field-row">
      <div class="field"><label>Grau de risco</label>
        <select id="dimGrau">
          ${[1,2,3,4].map(g=>`<option value="${g}" ${g===grau?'selected':''}>Grau ${g}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Número de colaboradores no estabelecimento</label><input type="number" min="0" id="dimNumEmp" value="${S._dimNumEmp||''}"></div>
    </div>
    <div id="dimResult">${renderDimResult()}</div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:10px;">
      <h3 style="margin:0;">Tabela de dimensionamento (editável)</h3>
      <div class="top-actions">
        <button class="btn btn-sm" id="btnResetDim">Restaurar padrão NR-05</button>
        <button class="btn btn-sm btn-primary" id="btnSaveDim">Salvar tabela</button>
      </div>
    </div>
    <div style="overflow-x:auto;">${tableHtml()}</div>
    <div class="hint" style="margin-top:8px;">Alterar um valor aqui muda o resultado do cálculo acima para todas as unidades — use se a empresa aplicar critério mais rígido que o mínimo legal da NR-05 (ex.: acordo ou convenção coletiva). Deixe o campo vazio para marcar a faixa como "sem exigência".</div>
  </div>`;
}

function bindDimensionamentoEvents(){
  const grauSel = document.getElementById('dimGrau');
  const numInput = document.getElementById('dimNumEmp');
  if(grauSel){
    grauSel.addEventListener('change', e=>{
      S._dimGrau = Number(e.target.value);
      const box = document.getElementById('dimResult');
      if(box) box.innerHTML = renderDimResult();
    });
  }
  if(numInput){
    numInput.addEventListener('input', e=>{
      S._dimNumEmp = e.target.value;
      const box = document.getElementById('dimResult');
      if(box) box.innerHTML = renderDimResult();
    });
  }
  document.querySelectorAll('[data-dim-grau]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const g = e.target.dataset.dimGrau;
      const tipo = e.target.dataset.dimTipo;
      const val = e.target.value===''? null : Number(e.target.value);
      if(e.target.dataset.dimExtra){
        S._dimBuffer.extra[g][tipo] = val==null?0:val;
      } else {
        const idx = Number(e.target.dataset.dimIdx);
        S._dimBuffer.matrix[g][tipo][idx] = val;
      }
    });
  });
  const btnReset = document.getElementById('btnResetDim');
  if(btnReset) btnReset.addEventListener('click', async ()=>{
    const ok = await dbSet('config', 'dimensionamento', DEFAULT_DIMENSIONAMENTO);
    if(ok) toast('Tabela restaurada ao padrão da NR-05.', 'ok');
  });
  const btnSave = document.getElementById('btnSaveDim');
  if(btnSave) btnSave.addEventListener('click', async ()=>{
    const ok = await dbSet('config', 'dimensionamento', S._dimBuffer);
    if(ok) toast('Tabela de dimensionamento salva.', 'ok');
  });
}

/* ---------------- Mandatos ---------------- */

/* ---------------- Membros (por gestão) ---------------- */
function selectedMemberIds(unit){
  return Object.keys(S._selMembers).filter(id=>{ if(!S._selMembers[id]) return false; const m = byId(S.members, id); return m && m.unitId===unit.id; });
}

function renderMembros(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){
    return `<div class="empty"><div class="big">${ico('usuario','style="width:32px;height:32px"')}</div>Cadastre um mandato antes de adicionar membros.</div>`;
  }
  const defaultMandate = activeMandate(unit.id) || mandates[0];
  const nSel = selectedMemberIds(unit).length;
  return `
  <div class="row" style="margin-bottom:8px; align-items:flex-start;">
    <div>
      <div class="sect-title" style="margin:0;">Membros por gestão</div>
      <div class="muted" style="font-size:13px; margin-top:2px; max-width:640px;">Eleitos pelos empregados têm estabilidade de 2 anos a partir da posse, calculada automaticamente. Indicados pelo empregador não têm.</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      ${nSel ? `<button class="btn btn-danger" id="btnBulkDelMembers">Excluir selecionados (${nSel})</button><button class="btn" id="btnClearSel">Limpar seleção</button>` : ''}
      <button class="btn" id="btnDownloadTemplate">${ico('download')}Baixar modelo</button>
      <button class="btn" id="btnImportMembers">${ico('upload')}Importar planilha</button>
      <button class="btn btn-primary" id="btnNewMember" data-mandate="${defaultMandate.id}">${ico('plus')}Novo membro</button>
    </div>
  </div>
  <div style="height:12px;"></div>
  ${mandates.map(m=>{
    const members = mandateMembers(m.id);
    const isCurrent = defaultMandate.id===m.id;
    const expanded = S._expandedMandates[m.id]!==undefined ? S._expandedMandates[m.id] : isCurrent;
    const allSel = members.length>0 && members.every(mm=>S._selMembers[mm.id]);
    const head = `<div class="panel-head">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</span>${isCurrent?'<span class="pill pill-info">Gestão atual</span>':'<span class="pill pill-muted">Encerrada</span>'}</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span class="muted" style="font-weight:400;font-size:13px;">${members.length} membro(s)</span>
          ${expanded ? `<button class="btn btn-sm" data-add-member-mandate="${m.id}">${ico('plus')}Adicionar</button>` : ''}
          <button class="btn btn-sm" data-toggle-mandate="${m.id}">${expanded?'Ocultar':'Ver membros'}</button></div>
      </div>`;
    const body = expanded ? `<table><thead><tr><th style="width:40px;"><input type="checkbox" data-sel-all="${m.id}" ${allSel?'checked':''} ${members.length?'':'disabled'} aria-label="Selecionar todos desta gestão"></th><th>Nome</th><th>Setor</th><th>Função</th><th>Tipo</th><th>Representação</th><th>Posse</th><th>Estabilidade</th><th></th></tr></thead><tbody>
      ${members.length===0 ? `<tr><td colspan="9" class="faint" style="padding:16px;text-align:center;">Nenhum membro nesta gestão.</td></tr>` :
      members.map(mm=>`<tr${mm.consecutiveAlert?' style="background:var(--warn-soft);"':''}>
        <td><input type="checkbox" data-sel-member="${mm.id}" ${S._selMembers[mm.id]?'checked':''} aria-label="Selecionar ${esc(mm.name)}"></td>

        <td>${mm.setor? esc(mm.setor) : '<span class="faint">—</span>'}</td>
        <td>${esc(mm.role||'—')}</td>
        <td>${esc(mm.type||'—')}</td>
        <td>${esc(mm.representationType||'—')}</td>
        <td>${mm.dataPosse? fmtDate(mm.dataPosse) : '<span class="faint">—</span>'}</td>
        <td>${stabilityCellHtml(mm, m)}</td>
        <td><div class="top-actions">
          <button class="btn btn-sm" data-edit-member="${mm.id}" aria-label="Editar ${esc(mm.name)}">${ico('editar')}</button>
          <button class="btn btn-sm btn-danger" data-del-member="${mm.id}">Excluir</button>
        </div></td>
      </tr>`).join('')}
      </tbody></table>` : '';
    return `<section class="panel" style="margin-bottom:16px;">${head}${body}</section>`;
  }).join('')}`;
}

const SUBTITULOS_PADRAO = [
  'Edital de abertura do processo eleitoral - SINDICATO',
  'Edital de abertura do processo eleitoral da CIPA',
  'Comissão Eleitoral',
  'Convocação para Eleição',
  'Ata de eleição e apuração dos votos',
  'Modelo E-mail Indicação empregador',
  'Ata Instalação e Posse',
  'Calendário de Reuniões',
  'Ata Reunião Ordinária'
];
function effectiveSubtitulos(){
  return (S.subtitulos && Array.isArray(S.subtitulos.lista) && S.subtitulos.lista.length) ? S.subtitulos.lista : SUBTITULOS_PADRAO;
}
function docTitleOrder(m){
  const base = (m && m.renewal && m.renewal.stages && m.renewal.stages.length) ? m.renewal.stages.map(x=>x.label).concat(DOC_FIXED_CATEGORIES) : DOC_CATEGORIES_NO_CRONOGRAMA;
  return base.concat(['Outros documentos']);
}
const DOC_FIXED_CATEGORIES = ['Ata de reunião','Comunicação MTE/eSocial','Plano de trabalho','Calendário anual'];
const DOC_CATEGORIES_NO_CRONOGRAMA = ['Edital de convocação','Ata de eleição','Termo de posse','Ata de reunião','Comunicação MTE/eSocial','Plano de trabalho','Calendário anual'];

function renderDocumentos(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){
    return `<div class="empty"><div class="big">${ico('doc','style="width:32px;height:32px"')}</div>Cadastre um mandato antes de enviar documentos.</div>`;
  }
  const defaultMandate = activeMandate(unit.id) || mandates[0];
  const subOrder = effectiveSubtitulos();
  const docLine = (d, grupo)=>{
    const principal = d.subtitulo || (d.name!==grupo ? d.name : (d.arquivo || 'Documento'));
    const arquivoNaMeta = d.arquivo && principal!==d.arquivo;
    const meta = [arquivoNaMeta ? esc(d.arquivo) : null, 'enviado em '+fmtDate((d.uploadedAt||'').slice(0,10)), d.fromLink ? 'via link'+(d.enviadoPor?' · '+esc(d.enviadoPor):'') : null].filter(Boolean).join(' · ');
    return `<div class="doc-item">
        <div class="doc-icon">${ico('doc')}</div>
        <div class="doc-info">
          <div class="name">${esc(principal)}</div>
          <div class="meta">${meta}</div>
        </div>
        <div class="top-actions">
          <button class="btn btn-sm" data-open-file="${d.assetId}" data-name="${esc(d.subtitulo||d.name)}" data-token="${d.fromLink||''}">Abrir</button>
          <button class="btn btn-sm btn-danger" data-del-doc="${d.id}" data-area="${(d.kind==='ata'||d.fromLink)?'atas':'documentos'}">Excluir</button>
        </div>
      </div>`;
  };
  return `
  <div class="row" style="margin-bottom:12px;">
    <div class="sect-title" style="margin:0;">Documentos — por gestão</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="btnSubtitulos">${ico('editar')}Gerenciar subtítulos</button>
      <button class="btn btn-primary" id="btnNewDoc" data-mandate="${defaultMandate.id}">${ico('upload')}Enviar documento</button>
    </div>
  </div>
  ${mandates.map(m=>{
    const docs = unitDocuments(unit.id, m.id);
    const isCurrent = defaultMandate.id===m.id;
    const order = docTitleOrder(m);
    const groups = {};
    docs.forEach(d=>{ const g = d.category || d.name || 'Sem título'; (groups[g] = groups[g] || []).push(d); });
    const keys = Object.keys(groups).sort((x,y)=>{
      const ix = order.indexOf(x), iy = order.indexOf(y);
      return (ix<0?999:ix) - (iy<0?999:iy) || x.localeCompare(y);
    });
    const body = keys.map(g=>{
      const list = groups[g].sort((x,y)=>{
        const sx = subOrder.indexOf(x.subtitulo||''), sy = subOrder.indexOf(y.subtitulo||'');
        return (sx<0?999:sx) - (sy<0?999:sy) || (x.reuniaoData||x.uploadedAt||'').localeCompare(y.reuniaoData||y.uploadedAt||'');
      });
      return `<div class="doc-group"><div class="doc-group-t">${esc(g)} <span class="faint" style="font-weight:400;">(${list.length})</span></div>${list.map(d=>docLine(d, g)).join('')}</div>`;
    }).join('');
    return `<div class="card">
      <div class="row" style="margin-bottom:8px;">
        <div class="row-title">${fmtDate(m.startDate)} – ${fmtDate(m.endDate)} ${isCurrent?'<span class="pill pill-ok" style="margin-left:6px;">gestão atual</span>':''}</div>
        <button class="btn btn-sm" data-add-doc-mandate="${m.id}">${ico('plus')}Adicionar aqui</button>
      </div>
      ${docs.length===0 ? `<div class="faint" style="padding:6px 0;">Nenhum documento nesta gestão.</div>` : body}
    </div>`;
  }).join('')}`;
}

/* ---------------- Atas de reunião ---------------- */
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ATA_TIPOS = ['Ordinária','Extraordinária','Posse','Outra'];

function monthsOfMandate(m){
  const out = [];
  if(!m.startDate || !m.endDate || m.startDate >= m.endDate) return out;
  let y = +m.startDate.slice(0,4), mo = +m.startDate.slice(5,7);
  const ey = +m.endDate.slice(0,4), emo = +m.endDate.slice(5,7);
  while((y<ey || (y===ey && mo<=emo)) && out.length<14){
    out.push({key: y+'-'+String(mo).padStart(2,'0'), label: MESES[mo-1]+'/'+y});
    mo++; if(mo>12){ mo = 1; y++; }
  }
  return out;
}
function mandateAtas(unitId, mandateId){
  return docsAll().filter(d=>d.unitId===unitId && d.mandateId===mandateId && d.kind==='ata')
    .sort((a,b)=>(a.reuniaoData||'').localeCompare(b.reuniaoData||''));
}

function renderAtas(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){
    return `<div class="empty"><div class="big">${ico('doc','style="width:32px;height:32px"')}</div>Cadastre um mandato antes de registrar atas.</div>`;
  }
  const cur = activeMandate(unit.id) || mandates[0];
  const curMonth = todayISO().slice(0,7);
  const ataLine = d => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0;">
      <span><b>${esc(d.reuniaoTipo||'Ata')}</b> · ${d.reuniaoData?fmtDate(d.reuniaoData):'sem data'}${d.pauta?`<span class="faint"> · ${esc(d.pauta.length>60?d.pauta.slice(0,60)+'…':d.pauta)}</span>`:''}${d.fromLink?` <span class="pill pill-info">via link${d.enviadoPor?' · '+esc(d.enviadoPor):''}</span>`:''}</span>
      <button class="btn btn-sm" data-open-file="${d.assetId}" data-name="${esc(d.name)}" data-token="${d.fromLink||''}">Abrir</button>
      <button class="btn btn-sm btn-danger" data-del-doc="${d.id}" data-area="${(d.kind==='ata'||d.fromLink)?'atas':'documentos'}">Excluir</button>
    </div>`;
  return `
  <div class="row" style="margin-bottom:8px; align-items:flex-start;">
    <div>
      <div class="sect-title" style="margin:0;">Atas de reunião</div>
      <div class="muted" style="font-size:13px; margin-top:2px; max-width:680px;">Registre e anexe a ata de cada reunião da CIPA. As atas ficam guardadas junto da documentação da gestão (aba Documentos). A CIPA se reúne ordinariamente todo mês, então cada mês da gestão aparece abaixo com a situação da ata.</div>
    </div>
    <button class="btn btn-primary" id="btnNewAta" data-mandate="${cur.id}">${ico('plus')}Registrar ata</button>
  </div>
  ${linkBoxHtml(cur)}
  <div style="height:12px;"></div>
  ${mandates.map(m=>{
    const months = monthsOfMandate(m);
    const atas = mandateAtas(unit.id, m.id);
    const byMonth = {};
    atas.forEach(a=>{ const k = (a.reuniaoData||'').slice(0,7); (byMonth[k] = byMonth[k]||[]).push(a); });
    const isCur = cur.id===m.id;
    const expanded = S._expandedMandates['ata_'+m.id]!==undefined ? S._expandedMandates['ata_'+m.id] : isCur;
    const withAta = months.filter(x=>byMonth[x.key]).length;
    const pending = months.filter(x=>!byMonth[x.key] && x.key<curMonth).length;
    const monthKeys = new Set(months.map(x=>x.key));
    const extras = atas.filter(a=>!monthKeys.has((a.reuniaoData||'').slice(0,7)));
    const head = `<div class="panel-head">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</span>${isCur?'<span class="pill pill-info">Gestão atual</span>':'<span class="pill pill-muted">Encerrada</span>'}</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span class="muted" style="font-weight:400;font-size:13px;">${withAta} de ${months.length} meses com ata${pending?` · <b style="color:var(--warn)">${pending} pendente(s)</b>`:''}</span>
          <button class="btn btn-sm" data-toggle-ata="${m.id}">${expanded?'Ocultar':'Ver atas'}</button>
        </div>
      </div>`;
    const rows = months.map(x=>{
      const list = byMonth[x.key] || [];
      let pill;
      if(list.length) pill = `<span class="pill pill-ok">Ata anexada</span>`;
      else if(x.key < curMonth) pill = `<span class="pill pill-warn">Pendente</span>`;
      else if(x.key === curMonth) pill = `<span class="pill pill-info">Neste mês</span>`;
      else pill = `<span class="pill pill-muted">Previsto</span>`;
      return `<tr>
        <td style="white-space:nowrap;font-weight:500;">${x.label}</td>
        <td>${pill}</td>
        <td>${list.length ? list.map(ataLine).join('') : '<span class="faint">Nenhuma ata registrada</span>'}</td>
        <td><button class="btn btn-sm" data-add-ata="1" data-mandate="${m.id}" data-month="${x.key}">${ico('upload')}Anexar ata</button></td>
      </tr>`;
    }).join('');
    const extraRows = extras.length ? `<tr><td style="font-weight:500;">Fora do período</td><td><span class="pill pill-muted">Outras</span></td><td>${extras.map(ataLine).join('')}</td><td></td></tr>` : '';
    const body = expanded ? `<table><thead><tr><th>Mês</th><th>Situação</th><th>Atas</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="faint" style="padding:16px;">Datas do mandato inválidas.</td></tr>'}${extraRows}</tbody></table>` : '';
    return `<section class="panel" style="margin-bottom:16px;">${head}${body}</section>`;
  }).join('')}`;
}

/* ---------------- Alertas tab ---------------- */
function renderAlertasTab(unit){
  const alerts = computeAllAlerts().filter(a=>a.unit && a.unit.id===unit.id);
  if(alerts.length===0) return `<div class="empty"><div class="big">${ico('check','style="width:32px;height:32px"')}</div>Nenhum alerta pendente para esta unidade.</div>`;
  const renewal = alerts.filter(a=>a.type==='renewal');
  const consec = alerts.filter(a=>a.type==='consecutive');
  const train = alerts.filter(a=>a.type==='training');
  const atasA = alerts.filter(a=>a.type==='ata');
  let html='';
  if(renewal.length) html += `<div class="card"><h3>Renovação de mandato (NR-05)</h3>${renewal.map(alertBoxHtml).join('')}</div>`;
  if(consec.length) html += `<div class="card"><h3>Possível 2º mandato consecutivo</h3>${consec.map(alertBoxHtml).join('')}</div>`;
  if(atasA.length) html += `<div class="card"><h3>Atas de reunião</h3>${atasA.map(alertBoxHtml).join('')}</div>`;
  if(train.length) html += `<div class="card"><h3>Certificados / treinamentos</h3>${train.map(alertBoxHtml).join('')}</div>`;
  return html;
}

/* ---------------- event binding per tab ---------------- */
function bindTabEvents(unit){
  const q = sel => document.querySelectorAll(sel);
  const b = (sel, fn) => { const els = q(sel); els.forEach(el=>el.addEventListener('click', ()=>fn(el))); };

  b('#btnNewMandate, #btnNewMandateQuick', ()=>openMandateModal(unit));
  b('[data-edit-mandate]', el=>openMandateModal(unit, byId(S.mandates, el.dataset.editMandate)));
  b('[data-del-mandate]', async el=>{
    if(confirm('Excluir este mandato? Membros e documentos vinculados continuarão existindo mas ficarão órfãos.')){
      await deactivateLinks(el.dataset.delMandate);
      await dbDelete('mandates', el.dataset.delMandate);
      toast('Mandato excluído.', 'ok');
    }
  });

  b('#btnNewMember', el=>openMemberModal(unit, el.dataset.mandate));
  b('[data-add-member-mandate]', el=>openMemberModal(unit, el.dataset.addMemberMandate));
  b('#btnDownloadTemplate', ()=>downloadMemberTemplate());
  b('#btnImportMembers', ()=>openImportMembersModal(unit));
  b('[data-edit-member]', el=>{
    const mem = byId(S.members, el.dataset.editMember);
    openMemberModal(unit, mem.mandateId, mem);
  });
  b('[data-del-member]', async el=>{
    const id = el.dataset.delMember;
    const nTr = S.trainings.filter(t=>t.memberId===id).length;
    if(confirm('Excluir este membro?'+(nTr ? ' Os '+nTr+' treinamento(s) dele também serão excluídos.' : ''))){
      await deleteMembersCascade([id]); delete S._selMembers[id]; toast('Membro excluído.', 'ok');
    }
  });
  document.querySelectorAll('[data-sel-member]').forEach(el=>el.addEventListener('change', ()=>{
    S._selMembers[el.dataset.selMember] = el.checked; renderMain();
  }));
  document.querySelectorAll('[data-sel-all]').forEach(el=>el.addEventListener('change', ()=>{
    mandateMembers(el.dataset.selAll).forEach(mm=>{ S._selMembers[mm.id] = el.checked; });
    renderMain();
  }));
  b('#btnClearSel', ()=>{ S._selMembers = {}; renderMain(); });
  b('#btnBulkDelMembers', async ()=>{
    const ids = selectedMemberIds(unit);
    if(!ids.length) return;
    const nTr = S.trainings.filter(t=>ids.includes(t.memberId)).length;
    const msg = 'Excluir '+ids.length+' membro(s)?'+(nTr ? ' Os '+nTr+' treinamento(s) e certificados deles também serão excluídos.' : '')+'\n\nEsta ação não pode ser desfeita.';
    if(!confirm(msg)) return;
    const n = await deleteMembersCascade(ids);
    S._selMembers = {};
    toast(n+' membro(s) excluído(s).', 'ok');
    renderMain();
  });
  b('#btnSubtitulos', ()=>openSubtitulosModal());
  b('#btnNewAta', el=>openAtaModal(unit, el.dataset.mandate));
  b('[data-add-ata]', el=>openAtaModal(unit, el.dataset.mandate, el.dataset.month));
  b('[data-toggle-ata]', el=>{
    const id = el.dataset.toggleAta, key = 'ata_'+id;
    const cur = S._expandedMandates[key]!==undefined ? S._expandedMandates[key] : ((activeMandate(unit.id)||{}).id===id);
    S._expandedMandates[key] = !cur;
    renderMain();
  });
  b('#btnDownloadTrTemplate', ()=>downloadTrainingTemplate());
  b('#btnImportTrainings', ()=>openImportTrainingsModal(unit));
  b('#btnGroupTraining', ()=>openGroupTrainingModal(unit));

  b('#btnNewDoc', el=>openDocModal(unit, el.dataset.mandate));
  b('[data-add-doc-mandate]', el=>openDocModal(unit, el.dataset.addDocMandate));
  b('[data-del-doc]', async el=>{
    if(!confirm('Excluir este documento?')) return;
    const id = el.dataset.delDoc;
    const doc = byId(S.documents, id);
    if(doc){
      await dbDelete('documents', id);
      if(doc.assetId && S.assets){ try{ await S.assets.delete(doc.assetId); }catch(e){} }
    } else {
      const ld = byId(S.linkDocs, id);
      if(ld){
        try{
          await S.db.subDoc('links', ld.fromLink, 'atas', ld.rawId).delete();
          if(ld.assetId) await S.assets.delete(ld.assetId, ld.fromLink);
        }catch(e){ toast('Não foi possível excluir: '+(e.message||e.code), 'err'); return; }
      }
    }
    toast('Documento excluído.', 'ok');
  });
  b('[data-gen-link]', async el=>{
    const m = byId(S.mandates, el.dataset.genLink); if(!m) return;
    if(S.links.some(l=>l.mandateId===m.id && l.ativo) && !confirm('O link atual deixará de funcionar. Gerar um novo link?')) return;
    const t = await generateLink(unit, m);
    if(t) toast('Novo link gerado.', 'ok');
  });
  b('[data-copy-link]', el=>copyLink(el.dataset.copyLink));
  b('[data-toggle-link]', async el=>{
    const parts = el.dataset.toggleLink.split('|');
    if(await dbUpdate('links', parts[0], {ativo: parts[1]==='1'})) toast(parts[1]==='1' ? 'Link reativado.' : 'Link desativado.', 'ok');
  });

  b('#btnNewTraining', ()=>openTrainingModal(unit));
  b('[data-del-training]', async el=>{
    if(confirm('Excluir este registro de treinamento?')){
      const t = byId(S.trainings, el.dataset.delTraining);
      await dbDelete('trainings', el.dataset.delTraining);
      if(t && t.certificateAssetId && S.assets){ try{ await S.assets.delete(t.certificateAssetId); }catch(e){} }
      toast('Treinamento excluído.', 'ok');
    }
  });

  b('[data-renewal-action]', el=>{
    const mandate = byId(S.mandates, el.dataset.renewalAction);
    if(!mandate) return;
    if(mandate.renewal && mandate.renewal.stages && mandate.renewal.stages.length){
      openRenewalEditModal(unit, mandate, mandate.renewal.stages.map(s=>({...s})), mandate.renewal.mode);
    } else {
      openRenewalChoiceModal(unit, mandate);
    }
  });

  b('#btnEditUnitInline', ()=>openUnitModal(unit));
  b('[data-open-file]', el=>openStoredFile(el.dataset.openFile, el.dataset.name, el.dataset.token));
  b('[data-open-unit-tab]', el=>goUnitTab(el.dataset.openUnitTab));
  b('[data-fix-mandate]', el=>openMandateModal(unit, byId(S.mandates, el.dataset.fixMandate)));
  b('[data-toggle-mandate]', el=>{
    const id = el.dataset.toggleMandate;
    const cur = S._expandedMandates[id]!==undefined ? S._expandedMandates[id] : ((activeMandate(unit.id)||{}).id===id);
    S._expandedMandates[id] = !cur;
    renderMain();
  });

  bindDimensionamentoEvents();
}

/* ---------------- modal shell ---------------- */
function openModal(title, bodyHtml, footHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="mBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="mClose" aria-label="Fechar">${ico('plus','style="transform:rotate(45deg)"')}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${footHtml}</div>
    </div>
  </div>`;
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------- Unit modal (criar/editar unidade + técnico responsável) ---------------- */
function openUnitModal(unit){
  const draft = {
    name: unit ? unit.name : '',
    cnpj: unit ? (unit.cnpj||'') : '',
    technicianId: unit ? (unit.technicianId||'') : ''
  };
  let addingTech = false;

  function captureDraft(){
    const n = document.getElementById('fUnitName');
    const c = document.getElementById('fUnitCnpj');
    const t = document.getElementById('fUnitTech');
    if(n) draft.name = n.value.trim();
    if(c) draft.cnpj = c.value.trim();
    if(t) draft.technicianId = t.value;
  }

  function formBodyHtml(){
    return `
    <div class="field"><label>Nome da unidade *</label><input id="fUnitName" placeholder="Ex: FIEG – Unidade Setor Norte" value="${esc(draft.name)}"></div>
    <div class="field"><label>CNPJ (opcional)</label><input id="fUnitCnpj" placeholder="00.000.000/0000-00" value="${esc(draft.cnpj)}"></div>
    <div class="field">
      <label>Técnico responsável</label>
      <div style="display:flex; gap:6px;">
        <select id="fUnitTech" style="flex:1;">
          <option value="">— nenhum —</option>
          ${S.technicians.map(t=>`<option value="${t.id}" ${draft.technicianId===t.id?'selected':''}>${esc(t.name)}${t.type?' — '+esc(t.type):''}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-sm" id="btnEditSelectedTech" title="Editar técnico selecionado" aria-label="Editar técnico selecionado">${ico('editar')}</button>
        <button type="button" class="btn btn-sm" id="btnNewTechInline" title="Cadastrar novo técnico" aria-label="Cadastrar novo técnico">${ico('plus')}</button>
      </div>
      <div class="hint">Você pode trocar o técnico responsável a qualquer momento, editando a unidade.</div>
    </div>`;
  }

  function addTechBodyHtml(){
    return `
    <div class="hint" style="margin-bottom:2px;">Cadastrar novo técnico responsável. Ao concluir, ele já fica selecionado para esta unidade.</div>
    <div class="field"><label>Nome completo *</label><input id="fTQName"></div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select id="fTQType">
          <option value="Técnico de Segurança do Trabalho">Técnico de Segurança do Trabalho</option>
          <option value="Engenheiro de Segurança">Engenheiro de Segurança</option>
          <option value="Médico do Trabalho">Médico do Trabalho</option>
          <option value="Enfermeiro do Trabalho">Enfermeiro do Trabalho</option>
        </select>
      </div>
      <div class="field"><label>Nº de registro</label><input id="fTQReg" placeholder="MTE / CREA / conselho"></div>
    </div>
    <div class="field"><label>Contato (e-mail/telefone)</label><input id="fTQContact"></div>
    <div class="top-actions" style="margin-top:4px;">
      <button type="button" class="btn btn-sm" id="btnCancelNewTech">Voltar</button>
      <button type="button" class="btn btn-sm btn-primary" id="btnConfirmNewTech">Adicionar técnico</button>
    </div>`;
  }

  function render(){
    openModal(
      unit? 'Editar unidade' : 'Nova unidade',
      addingTech ? addTechBodyHtml() : formBodyHtml(),
      addingTech ? '' : `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`
    );
    bind();
  }

  function bind(){
    if(!addingTech){
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('btnNewTechInline').addEventListener('click', ()=>{ captureDraft(); addingTech=true; render(); });
      document.getElementById('btnEditSelectedTech').addEventListener('click', ()=>{
        captureDraft();
        if(!draft.technicianId){ toast('Selecione um técnico para editar.', 'err'); return; }
        openTechModal(byId(S.technicians, draft.technicianId));
      });
      document.getElementById('mSave').addEventListener('click', async ()=>{
        captureDraft();
        if(!draft.name){ toast('Informe o nome da unidade.', 'err'); return; }
        const data = {name: draft.name, cnpj: draft.cnpj, technicianId: draft.technicianId||null};
        let ok;
        if(unit) ok = await dbUpdate('units', unit.id, data);
        else { const id = await dbAdd('units', data); ok = !!id; if(id) S.currentUnitId = id; }
        if(ok){ closeModal(); toast(unit? 'Unidade atualizada.' : 'Unidade cadastrada.', 'ok'); }
      });
    } else {
      document.getElementById('btnCancelNewTech').addEventListener('click', ()=>{ addingTech=false; render(); });
      document.getElementById('btnConfirmNewTech').addEventListener('click', async ()=>{
        const name = document.getElementById('fTQName').value.trim();
        if(!name){ toast('Informe o nome do técnico.', 'err'); return; }
        const id = await dbAdd('technicians', {
          name, type: document.getElementById('fTQType').value,
          registrationNumber: document.getElementById('fTQReg').value.trim(),
          contact: document.getElementById('fTQContact').value.trim()
        });
        if(id){ draft.technicianId = id; addingTech=false; toast('Técnico cadastrado.', 'ok'); render(); }
      });
    }
  }

  render();
}

/* ---------------- Mandate modal ---------------- */
function openMandateModal(unit, mandate){
  const temLink = !!(mandate && S.links.some(l=>l.mandateId===mandate.id && l.ativo));
  openModal(mandate? 'Editar mandato' : 'Novo mandato', `
    <div class="field-row">
      <div class="field"><label>Início *</label><input type="date" id="fMStart" value="${mandate?mandate.startDate:''}"></div>
      <div class="field"><label>Fim *</label><input type="date" id="fMEnd" value="${mandate?mandate.endDate:''}"></div>
    </div>
    <div class="field"><label>Status</label>
      <select id="fMStatus">
        <option value="ativo" ${mandate&&mandate.status==='ativo'?'selected':''}>Ativo</option>
        <option value="encerrado" ${mandate&&mandate.status==='encerrado'?'selected':''}>Encerrado</option>
      </select>
    </div>
    ${temLink ? '' : `<label id="fMLinkWrap" style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--text);font-size:13px;"><input type="checkbox" id="fMLink" ${!mandate?'checked':''} style="margin-top:3px;"><span><b>Gerar link para envio de atas</b> (sem login)<br><span class="faint">Só para mandato ativo. A CIPA envia e consulta as atas por esse link.</span></span></label>`}
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  const stSel = document.getElementById('fMStatus'), lkWrap = document.getElementById('fMLinkWrap');
  if(lkWrap){ const syncLk = ()=>{ lkWrap.style.display = stSel.value==='ativo' ? 'flex' : 'none'; }; stSel.addEventListener('change', syncLk); syncLk(); }
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const startDate = document.getElementById('fMStart').value;
    const endDate = document.getElementById('fMEnd').value;
    if(!startDate || !endDate){ toast('Informe início e fim do mandato.', 'err'); return; }
    if(startDate >= endDate){ toast('A data de início precisa ser anterior à data de fim do mandato.', 'err'); return; }
    const data = {
      unitId: unit.id, unitName: unit.name, startDate, endDate,
      status: document.getElementById('fMStatus').value
    };
    let ok;
    if(mandate) ok = await dbUpdate('mandates', mandate.id, data);
    else ok = await dbAdd('mandates', data);
    if(ok){
      const mid = mandate ? mandate.id : ok;
      const chk = document.getElementById('fMLink');
      if(data.status==='encerrado') await deactivateLinks(mid);
      else {
        for(const l of S.links.filter(x=>x.mandateId===mid && x.ativo)) await dbUpdate('links', l.id, {inicio:startDate, fim:endDate});
        if(chk && chk.checked){
          const t = await generateLink(unit, {id:mid, startDate, endDate});
          if(t) toast('Mandato salvo e link para envio de atas gerado.', 'ok');
        }
      }
      closeModal(); toast('Mandato salvo.', 'ok');
    }
  });
}

          <option value="Eleito" ${member&&member.type==='Eleito'?'selected':''}>Eleito</option>

        </select>

        <select id="fMemRep">
          <option value="Empregados" ${member&&member.representationType==='Empregados'?'selected':''}>Empregados</option>

  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);

  function updateStabilityPreview(){
    const type = document.getElementById('fMemType').value;
    const rep = document.getElementById('fMemRep').value;
    const posse = document.getElementById('fMemPosse').value;
    const box = document.getElementById('stabilityPreview');
    if(type==='Eleito' && rep==='Empregados'){
      if(posse){
        const end = addYearsISO(posse, 2);
        box.innerHTML = `<div class="hint" style="color:var(--ok);">Estabilidade automática: vigente até ${fmtDate(end)} (2 anos a partir da posse).</div>`;
      } else {
        box.innerHTML = `<div class="hint">Informe a data da posse para calcular a estabilidade automaticamente (2 anos).</div>`;
      }

    const name = document.getElementById('fMemName').value.trim();
    const matricula = document.getElementById('fMemMatricula').value.trim();
    const curMandateId = document.getElementById('fMemMandate').value;
    const box = document.getElementById('consecWarning');

    } else box.innerHTML='';
    return res;
  }
  document.getElementById('fMemName').addEventListener('blur', checkAndWarn);
  document.getElementById('fMemMatricula').addEventListener('blur', checkAndWarn);
  document.getElementById('fMemMandate').addEventListener('change', checkAndWarn);
  if(member) checkAndWarn();

  document.getElementById('mSave').addEventListener('click', async ()=>{
    const name = document.getElementById('fMemName').value.trim();
    const matricula = document.getElementById('fMemMatricula').value.trim();
    const selectedMandateId = document.getElementById('fMemMandate').value;

      setor: document.getElementById('fMemSetor').value.trim(),

      consecutiveAlert: !!consec

    let ok;

    else ok = await dbAdd('members', data);
    if(ok){ closeModal(); toast(consec? 'Membro salvo — atenção ao alerta de 2º mandato.' : 'Membro salvo.', consec?'':'ok'); }
  });
}

/* ---------------- Import de membros via planilha (CSV) ---------------- */
function openImportMembersModal(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){ toast('Cadastre um mandato antes de importar membros.', 'err'); return; }
  const defaultMandate = activeMandate(unit.id) || mandates[0];
  let parsedRows = null;

  openModal('Importar planilha de membros', `
    <div class="field"><label>Gestão (mandato) de destino *</label>
      <select id="impMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===defaultMandate.id?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Arquivo (.csv) *</label><input type="file" id="impFile" accept=".csv,text/csv"></div>
    <div class="hint">Use o modelo (botão "Baixar modelo" na tela de Membros). Colunas: Nome completo, Matrícula (opcional), Setor, Cargo/Função, Função na CIPA, Tipo, Representação e Data da Posse (DD/MM/AAAA, opcional; calcula a estabilidade dos eleitos). Apague ou edite a linha de exemplo antes de importar.</div>
    <div id="impPreview"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mImport" disabled>Importar</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);
  const fileInput = document.getElementById('impFile');
  const previewBox = document.getElementById('impPreview');
  const importBtn = document.getElementById('mImport');

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    let text;
    try{ text = await file.text(); }
    catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }
    const rows = parseCSVMembers(text);
    parsedRows = rows;
    if(rows.length===0){
      previewBox.innerHTML = `<div class="alert-box warn"><span>${ico('alerta')}</span><div class="txt">Nenhuma linha de dados encontrada. Confira se o arquivo é o modelo em CSV com cabeçalho na primeira linha.</div></div>`;
      importBtn.disabled = true;
      return;
    }
    const valid = rows.filter(r=>r.errors.length===0);
    previewBox.innerHTML = `
      <div class="hint" style="margin:8px 0;">${valid.length} válido(s) de ${rows.length} linha(s).</div>
      <div style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;">
        <table style="font-size:12px;"><thead><tr><th>Linha</th><th>Nome</th><th>Matrícula</th><th>Situação</th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td>${r.rowIndex}</td>
          <td>${esc(r.name||'—')}</td>
          <td>${esc(r.matricula||'—')}</td>
          <td>${r.errors.length? `<span class="pill pill-danger">${esc(r.errors.join('; '))}</span>` : '<span class="pill pill-ok">ok</span>'}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>`;
    importBtn.disabled = valid.length===0;
  });

  importBtn.addEventListener('click', async ()=>{
    if(!parsedRows) return;
    const mandateId = document.getElementById('impMandate').value;
    const valid = parsedRows.filter(r=>r.errors.length===0);
    importBtn.disabled = true; importBtn.textContent = 'Importando…';
    let ok=0, fail=0, consecCount=0;
    for(const r of valid){
      const consec = checkConsecutive(unit.id, r.name, r.matricula, mandateId);
      if(consec) consecCount++;
      const id = await dbAdd('members', {
        unitId: unit.id, mandateId, name:r.name, matricula:r.matricula||'', setor:r.setor||'',
        jobTitle:r.jobTitle||'', role:r.role, type:r.type, representationType:r.representationType,
        dataPosse: r.dataPosse||null,
        consecutiveAlert: !!consec
      });
      if(id) ok++; else fail++;
    }
    closeModal();
    let msg = ok+' membro(s) importado(s).';
    if(fail) msg += ' '+fail+' falharam.';
    if(consecCount) msg += ' '+consecCount+' com alerta de 2º mandato — confira na lista.';
    toast(msg, fail? 'err' : (consecCount? 'ok' : 'ok'));
  });
}

/* ---------------- Exclusão de membros (com os treinamentos deles) ---------------- */
async function deleteMembersCascade(ids){
  const idSet = new Set(ids);
  const trs = S.trainings.filter(t=>idSet.has(t.memberId));
  for(const t of trs){
    if(t.certificateAssetId && S.assets){ try{ await S.assets.delete(t.certificateAssetId); }catch(e){} }
  }
  await Promise.all(trs.map(t=>dbDelete('trainings', t.id)));
  const results = await Promise.all(ids.map(id=>dbDelete('members', id)));
  return results.filter(Boolean).length;
}

const CURSO_PADRAO = 'Curso básico de CIPA (NR-05)';

async function readFileText(file){
  const buf = await new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error('Não foi possível ler o arquivo.'));
    r.readAsArrayBuffer(file);
  });
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); } // CSV salvo pelo Excel sem "UTF-8"
}

    '2026/2027;08/09/2026;04/09/2026;CASA DA INDUSTRIA;SENAI;12345;MARIA DA SILVA;ANALISTA II - ANALISTA ADMINISTRATIVO;ELEITO;GERHC');

function parseCSVUnidades(text){
  const table = parseCSVTable(text);
  if(!table.length) return {rows:[], faltando:['cabeçalho na primeira linha']};
  const header = table[0].map(normHeaderKey);
  const find = fn => header.findIndex(fn);
  const idx = {
    gestao: find(h=>h.startsWith('gest')),
    posse: find(h=>h.includes('posse')),
    treino: find(h=>h.includes('treinamento')),
    unidade: find(h=>h.startsWith('unid')),
    entidade: find(h=>h.startsWith('entid')),
    matricula: find(h=>h.startsWith('matr')),
    nome: find(h=>h.startsWith('nome')),
    funcao: find(h=>h.startsWith('fun')),
    tipo: find(h=>h.includes('eleito') || h.includes('indicado')),
    setor: find(h=>h.startsWith('depart') || h.includes('gerenc') || h==='setor')
  };
  const nomes = {posse:'DATA DA POSSE', unidade:'UNIDADE', nome:'NOME', tipo:'ELEITO / INDICADO'};
  const faltando = Object.keys(nomes).filter(k=>idx[k]<0).map(k=>nomes[k]);
  const rows = [];
  if(faltando.length) return {rows, faltando};
  for(let i=1;i<table.length;i++){
    const cells = table[i];
    if(cells.every(c=>!c || !c.trim())) continue;
    const get = k => idx[k]>=0 ? (cells[idx[k]]||'').trim() : '';
    const errors = [];
    const unidade = get('unidade'), entidade = get('entidade'), nome = get('nome');
    if(!unidade) errors.push('unidade ausente');
    if(!nome) errors.push('nome ausente');
    const tipo = matchEnumValue(get('tipo'), IMPORT_TYPE_OPTIONS);
    if(!tipo) errors.push('eleito/indicado inválido ("'+get('tipo')+'")');
    const posse = parseFlexibleDate(get('posse'));
    if(!posse) errors.push('data da posse ausente ou inválida');
    const treinoRaw = get('treino');
    const treino = treinoRaw ? parseFlexibleDate(treinoRaw) : null;
    if(treinoRaw && !treino) errors.push('data do treinamento inválida');
    rows.push({rowIndex:i+1, gestao:get('gestao'), posse, treino, unidade, entidade, matricula:get('matricula'), nome, funcao:get('funcao'), tipo, setor:get('setor'), errors});
  }
  return {rows, faltando:[]};
}

function consecutivoPrevio(unitId, start, name, matricula){
  const prev = S.mandates.filter(m=>m.unitId===unitId && m.startDate < start).sort((a,b)=>b.startDate.localeCompare(a.startDate))[0];
  if(!prev) return null;
  const n = normStr(name), mat = normStr(matricula);
  return S.members.find(mm=>mm.mandateId===prev.id && normStr(mm.name)===n && ((mat && normStr(mm.matricula)) ? normStr(mm.matricula)===mat : true)) || null;
}

const chaveNome = t => stripAccents(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const sobrepoe = (m, ini, fim) => !!m.startDate && !!m.endDate && m.startDate < fim && m.endDate > ini;

function montarPlanoUnidades(rows){
  const hoje = todayISO();
  const grupos = new Map();
  rows.filter(r=>!r.errors.length).forEach(r=>{
    const nome = r.entidade ? r.unidade+' – '+r.entidade : r.unidade;
    const k = chaveNome(nome);
    if(!grupos.has(k)) grupos.set(k, {nome, base:r.unidade, gestoes:new Map()});
    const g = grupos.get(k), gk = r.gestao || '(sem gestão)';
    if(!g.gestoes.has(gk)) g.gestoes.set(gk, {gestao:r.gestao, rows:[]});
    g.gestoes.get(gk).rows.push(r);
  });
  const plano = [];
  grupos.forEach(g=>{
    const existente = S.units.find(u=>chaveNome(u.name)===chaveNome(g.nome)) || null;
    const baseK = chaveNome(g.base);
    const parecida = (!existente && baseK.length>=4) ? (S.units.find(u=>{ const k = chaveNome(u.name); return k.length>=4 && (k.includes(baseK) || baseK.includes(k)); }) || null) : null;
    const mandatos = [];
    g.gestoes.forEach(gs=>{
      const start = gs.rows.map(r=>r.posse).sort()[0];
      const end = addYearsISO(start, 1);
      const mExist = existente ? (S.mandates.find(m=>m.unitId===existente.id && m.startDate===start) || S.mandates.find(m=>m.unitId===existente.id && sobrepoe(m, start, end)) || null) : null;
      const vistos = new Set(), membros = [];
      gs.rows.forEach(r=>{
        const mat = normStr(r.matricula);
        const chave = mat || 'n:'+normStr(r.nome);
        if(vistos.has(chave)) return;
        vistos.add(chave);
        const mem = mExist ? S.members.find(x=>x.mandateId===mExist.id && (mat ? normStr(x.matricula)===mat : chaveNome(x.name)===chaveNome(r.nome))) : null;
        membros.push({r, existente: mem || null});
      });
      mandatos.push({gestao:gs.gestao, start, end, status: end<hoje ? 'encerrado' : 'ativo', existente:mExist, membros});
    });
    plano.push({nome:g.nome, existente, parecida, mandatos});
  });
  return plano.sort((a,b)=>a.nome.localeCompare(b.nome));
}

function remendoMembro(ex, r){
  const patch = {};
  if(!ex.setor && r.setor) patch.setor = r.setor;
  if(!ex.jobTitle && r.funcao) patch.jobTitle = r.funcao;
  if(!ex.dataPosse && r.posse) patch.dataPosse = r.posse;
  return patch;
}

function contarPlano(plano, opts){
  const c = {unidades:0, mandatos:0, membros:0, treinos:0, completar:0};
  plano.forEach(u=>{
    if(!u.existente) c.unidades++;
    u.mandatos.forEach(m=>{
      if(!m.existente) c.mandatos++;
      m.membros.forEach(mb=>{
        if(!mb.existente) c.membros++;
        else if(opts.completar && Object.keys(remendoMembro(mb.existente, mb.r)).length) c.completar++;
        if(mb.r.treino && !(mb.existente && trainingDuplicate(mb.existente.id, opts.curso, mb.r.treino))) c.treinos++;
      });
    });
  });
  return c;
}

async function executarPlanoUnidades(plano, opts, onProgresso){
  const res = {unidades:0, mandatos:0, membros:0, treinos:0, atualizados:0, falhas:0};
  for(const u of plano){
    let unitId = u.existente ? u.existente.id : null;
    if(!unitId){
      unitId = await dbAdd('units', {name:u.nome, cnpj:'', technicianId:null});
      if(unitId) res.unidades++; else { res.falhas++; continue; }
    }
    for(const m of u.mandatos){
      let mandateId = m.existente ? m.existente.id : null;
      if(!mandateId){
        mandateId = await dbAdd('mandates', {unitId, unitName:u.nome, startDate:m.start, endDate:m.end, status:m.status, gestao:m.gestao||''});
        if(mandateId) res.mandatos++; else { res.falhas++; continue; }
      }
      const tarefas = m.membros.map(mb=>async()=>{
        const r = mb.r;
        let memberId = mb.existente ? mb.existente.id : null;
        if(!memberId){
          const consec = consecutivoPrevio(unitId, m.start, r.nome, r.matricula);
          memberId = await dbAdd('members', {
            unitId, mandateId, name:r.nome, matricula:r.matricula||'', setor:r.setor||'', jobTitle:r.funcao||'',
            role:'Titular', type:r.tipo, representationType: r.tipo==='Eleito' ? 'Empregados' : 'Empregador',
            dataPosse:r.posse, consecutiveAlert: !!consec
          });
          if(memberId) res.membros++; else { res.falhas++; return; }
        }
        if(mb.existente && opts.completar){
          const patch = remendoMembro(mb.existente, r);
          if(Object.keys(patch).length){
            const ok = await dbUpdate('members', memberId, patch);
            if(ok) res.atualizados++; else res.falhas++;
          }
        }
        if(r.treino && !(mb.existente && trainingDuplicate(memberId, opts.curso, r.treino))){
          const exp = opts.validadeAnos ? addYearsISO(r.treino, opts.validadeAnos) : null;
          const tid = await dbAdd('trainings', {memberId, unitId, courseName:opts.curso, hours:opts.horas||null, completionDate:r.treino, expiryDate:exp});
          if(tid) res.treinos++; else res.falhas++;
        }
      });
      for(let i=0;i<tarefas.length;i+=15){
        await Promise.all(tarefas.slice(i,i+15).map(f=>f()));
        if(onProgresso) onProgresso(res);
      }
    }
  }
  return res;
}

    const f = document.getElementById('iuFile').files[0]; if(!f) return;
    let text; try{ text = await readFileText(f); }catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }
    const out = parseCSVUnidades(text);
    if(out.faltando.length){
      rows = null; plano = null; btn.disabled = true;
      box.innerHTML = `<div class="alert-box warn" style="margin-top:10px;"><span>${ico('alerta')}</span><div class="txt">Não encontrei estas colunas no arquivo: <b>${esc(out.faltando.join(', '))}</b>. Confira se o cabeçalho está na primeira linha e se o arquivo é um CSV.</div></div>`;
      return;
    }
    rows = out.rows;
    plano = montarPlanoUnidades(rows);
    desenhar();
  });

  btn.addEventListener('click', async ()=>{
    if(!plano || S._importando) return;
    S._importando = true;
    const o = opcoes();
    btn.disabled = true; btn.textContent = 'Importando…';
    let res;
    try{
      res = await executarPlanoUnidades(plano, o, r=>{ btn.textContent = 'Importando… ('+r.membros+' membros)'; });
    }finally{ S._importando = false; }
    closeModal();
    toast(res.unidades+' unidade(s), '+res.mandatos+' mandato(s), '+res.membros+' membro(s) e '+res.treinos+' treinamento(s) importados.'+(res.atualizados?' '+res.atualizados+' membro(s) já cadastrado(s) completado(s).':'')+(res.falhas?' '+res.falhas+' falharam.':''), res.falhas ? 'err' : 'ok');
  });
}

/* ---------------- Document modal (upload) ---------------- */
function openDocModal(unit, presetMandateId){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){ toast('Cadastre um mandato antes de enviar documentos.', 'err'); return; }
  if(!S.assets){ toast('Upload de arquivos não está disponível nesta visualização.', 'err'); return; }
  let currentMandate = byId(mandates, presetMandateId) || mandates[0];

  function titleOptionsFor(mandate){
    if(mandate && mandate.renewal && mandate.renewal.stages && mandate.renewal.stages.length){
      return mandate.renewal.stages.map(s=>s.label).concat(DOC_FIXED_CATEGORIES);
    }
    return DOC_CATEGORIES_NO_CRONOGRAMA;
  }
  function titleSelectHtml(mandate){
    return titleOptionsFor(mandate).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('') + `<option value="__outros__">Outros documentos</option>`;
  }

  openModal('Enviar documento', `
    <div class="field"><label>Gestão (mandato) *</label>
      <select id="fDocMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===currentMandate.id?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Título do documento *</label>
      <select id="fDocTitle">${titleSelectHtml(currentMandate)}</select>
      <div class="hint">Os títulos seguem as etapas do cronograma de renovação desta gestão, quando houver um cadastrado.</div>
    </div>
    <div class="field" id="fDocCustomWrap" style="display:none;">
      <label>Novo título *</label>
      <input id="fDocCustomName" placeholder="Digite o título do documento">
    </div>
    <div class="field"><label>Subtítulo (opcional)</label>
      <select id="fDocSub"><option value="">— sem subtítulo —</option>${effectiveSubtitulos().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}<option value="__outro__">Outro (digitar)</option></select>
      <div class="hint">Tipo do documento dentro do título. A lista pode ser editada em "Gerenciar subtítulos".</div>
    </div>
    <div class="field" id="fDocSubWrap" style="display:none;">
      <label>Novo subtítulo *</label>
      <input id="fDocSubCustom" placeholder="Digite o subtítulo">
    </div>
    <div class="field"><label>Arquivo * (até 5 MB)</label><input type="file" id="fDocFile"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Enviar</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);
  const subSel = document.getElementById('fDocSub');
  subSel.addEventListener('change', ()=>{ document.getElementById('fDocSubWrap').style.display = subSel.value==='__outro__' ? '' : 'none'; });

  const mandateSel = document.getElementById('fDocMandate');
  const titleSel = document.getElementById('fDocTitle');
  const customWrap = document.getElementById('fDocCustomWrap');

  function refreshCustomVisibility(){
    customWrap.style.display = titleSel.value==='__outros__' ? '' : 'none';
  }
  refreshCustomVisibility();

  mandateSel.addEventListener('change', ()=>{
    currentMandate = byId(mandates, mandateSel.value);
    titleSel.innerHTML = titleSelectHtml(currentMandate);
    refreshCustomVisibility();
  });
  titleSel.addEventListener('change', refreshCustomVisibility);

  document.getElementById('mSave').addEventListener('click', async ()=>{
    const isCustom = titleSel.value==='__outros__';
    const name = isCustom ? document.getElementById('fDocCustomName').value.trim() : titleSel.value;
    const fileInput = document.getElementById('fDocFile');
    const file = fileInput.files[0];
    if(!name || !file){ toast('Informe o título e selecione um arquivo.', 'err'); return; }
    let sub = subSel.value;
    if(sub==='__outro__'){ sub = document.getElementById('fDocSubCustom').value.trim(); if(!sub){ toast('Digite o subtítulo ou escolha outro da lista.', 'err'); return; } }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Enviando…';
    try{
      const res = await S.assets.upload(file);
      await dbAdd('documents', {
        unitId: unit.id, mandateId: mandateSel.value, area: 'documentos',
        category: isCustom ? 'Outros documentos' : name,
        name, subtitulo: sub || null, arquivo: file.name,
        assetId: res.id, url: res.url||'', contentType: res.contentType, sizeBytes: res.sizeBytes,
        uploadedAt: new Date().toISOString()
      });
      closeModal(); toast('Documento enviado.', 'ok');
    }catch(e){
      toast('Falha no envio: '+(e.message||e.code), 'err');
      saveBtn.disabled=false; saveBtn.textContent='Enviar';
    }
  });
}

/* ---------------- Training modal ---------------- */
function openTrainingModal(unit){
  const mandates = unitMandates(unit.id);
  const memberIds = new Set();
  mandates.forEach(m=>mandateMembers(m.id).forEach(mem=>memberIds.add(mem.id)));
  const unitMembers = S.members.filter(m=>memberIds.has(m.id));
  if(unitMembers.length===0){ toast('Cadastre membros antes de registrar treinamentos.', 'err'); return; }
  openModal('Novo treinamento / certificado', `
    <div class="field"><label>Membro *</label>
      <select id="fTrMember">${unitMembers.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Curso / treinamento *</label><input id="fTrCourse" placeholder="Ex: Curso básico de CIPA (NR-05)"></div>
    <div class="field-row">
      <div class="field"><label>Carga horária (h)</label><input type="number" id="fTrHours" min="0"></div>
      <div class="field"><label>Conclusão *</label><input type="date" id="fTrDone"></div>
    </div>
    <div class="field"><label>Validade (opcional)</label><input type="date" id="fTrExpiry"></div>
    <div class="field"><label>Certificado (arquivo, opcional, até 5 MB)</label><input type="file" id="fTrFile"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const memberId = document.getElementById('fTrMember').value;
    const courseName = document.getElementById('fTrCourse').value.trim();
    const completionDate = document.getElementById('fTrDone').value;
    if(!courseName || !completionDate){ toast('Informe curso e data de conclusão.', 'err'); return; }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
    const data = {
      memberId, courseName, unitId: unit.id,
      hours: Number(document.getElementById('fTrHours').value)||null,
      completionDate,
      expiryDate: document.getElementById('fTrExpiry').value || null
    };
    try{
      const file = document.getElementById('fTrFile').files[0];
      if(file && S.assets){
        const res = await S.assets.upload(file);
        data.certificateAssetId = res.id; data.certificateUrl = res.url;
      }
      await dbAdd('trainings', data);
      closeModal(); toast('Treinamento salvo.', 'ok');
    }catch(e){
      toast('Falha ao salvar: '+(e.message||e.code), 'err');
      saveBtn.disabled=false; saveBtn.textContent='Salvar';
    }
  });
}

/* ---------------- Renewal (cronograma) modals ---------------- */
function openRenewalChoiceModal(unit, mandate){
  openModal('Iniciar renovação', `
    <p class="muted" style="margin:0;">Mandato ${fmtDate(mandate.startDate)} – ${fmtDate(mandate.endDate)}. O período de inscrição de candidatos é sempre de ${INSCRICAO_DIAS} dias. Como deseja montar o cronograma do processo eleitoral, conforme a NR-05?</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
      <button class="btn btn-primary" id="bAuto" style="justify-content:center; padding:14px;">Gerar automático<br><span style="font-weight:400; font-size:12px;">A partir de ${PROCESS_LEAD_DAYS} dias antes do fim do mandato</span></button>
      <button class="btn" id="bManual" style="justify-content:center; padding:14px;">Preencher manualmente<br><span style="font-weight:400; font-size:12px;">Mesmas etapas, você define as datas</span></button>
    </div>
  `, `<button class="btn" id="mCancel">Cancelar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('bAuto').addEventListener('click', ()=>{
    openRenewalEditModal(unit, mandate, generateAutoRenewalStages(mandate), 'auto');
  });
  document.getElementById('bManual').addEventListener('click', ()=>{
    openRenewalEditModal(unit, mandate, generateManualRenewalStages(), 'manual');
  });
}

function openRenewalEditModal(unit, mandate, stages, mode){
  function stageRowHtml(s, idx){
    const doneBox = `<label style="display:flex; gap:5px; align-items:center; font-weight:400; font-size:12px; white-space:nowrap; margin-left:8px; color:var(--text-muted);"><input type="checkbox" data-stage-idx="${idx}" data-stage-field="done" ${s.done?'checked':''}> concluída</label>`;
    if(s.type==='single'){
      return `<div class="field"><label>${esc(s.label)}</label><div style="display:flex; align-items:center;"><input type="date" data-stage-idx="${idx}" data-stage-field="date" value="${s.date||''}" style="flex:1;">${doneBox}</div></div>`;
    }
    return `<div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>${esc(s.label)} — início</label><input type="date" data-stage-idx="${idx}" data-stage-field="startDate" value="${s.startDate||''}"></div>
      <div class="field"><label>${esc(s.label)} — fim${s.key==='inscricao'?' ('+INSCRICAO_DIAS+' dias)':''}</label><div style="display:flex; align-items:center;"><input type="date" data-stage-idx="${idx}" data-stage-field="endDate" value="${s.endDate||''}" style="flex:1;">${doneBox}</div></div>
    </div>`;
  }
  openModal('Cronograma de renovação', `
    <div class="hint" style="margin-bottom:2px;">${mode==='auto'?'Gerado automaticamente a partir de '+PROCESS_LEAD_DAYS+' dias antes do fim do mandato.':'Preenchimento manual.'} Datas e etapas concluídas podem ser ajustadas a qualquer momento, até a posse.</div>
    ${stages.map(stageRowHtml).join('')}
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar cronograma</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-stage-idx]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.stageIdx);
      const field = e.target.dataset.stageField;
      if(field==='done'){ stages[idx].done = e.target.checked; return; }
      stages[idx][field] = e.target.value;
      if(stages[idx].key==='inscricao' && field==='startDate' && e.target.value && !stages[idx].endDate){
        stages[idx].endDate = addDaysISO(e.target.value, INSCRICAO_DIAS);
        const endInput = document.querySelector(`[data-stage-idx="${idx}"][data-stage-field="endDate"]`);
        if(endInput) endInput.value = stages[idx].endDate;
      }
    });
  });
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const allDone = stages.every(s=>s.done);
    const ok = await dbUpdate('mandates', mandate.id, {
      renewal: {mode, status: allDone?'concluido':'em_andamento', updatedAt: new Date().toISOString(), stages}
    });
    if(ok){
      closeModal();
      toast(allDone? 'Processo de renovação concluído — posse registrada.' : 'Cronograma salvo.', 'ok');
    }
  });
}

function openTechModal(tech){
  openModal(tech?'Editar técnico':'Cadastrar técnico responsável', `
    <div class="field"><label>Nome completo *</label><input id="fTecName" value="${tech?esc(tech.name):''}"></div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select id="fTecType">
          <option value="Técnico de Segurança do Trabalho" ${tech&&tech.type==='Técnico de Segurança do Trabalho'?'selected':''}>Técnico de Segurança do Trabalho</option>
          <option value="Engenheiro de Segurança" ${tech&&tech.type==='Engenheiro de Segurança'?'selected':''}>Engenheiro de Segurança</option>
          <option value="Médico do Trabalho" ${tech&&tech.type==='Médico do Trabalho'?'selected':''}>Médico do Trabalho</option>
          <option value="Enfermeiro do Trabalho" ${tech&&tech.type==='Enfermeiro do Trabalho'?'selected':''}>Enfermeiro do Trabalho</option>
        </select>
      </div>
      <div class="field"><label>Nº de registro</label><input id="fTecReg" placeholder="MTE / CREA / conselho" value="${tech?esc(tech.registrationNumber||''):''}"></div>
    </div>
    <div class="field"><label>Contato (e-mail/telefone)</label><input id="fTecContact" value="${tech?esc(tech.contact||''):''}"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const name = document.getElementById('fTecName').value.trim();
    if(!name){ toast('Informe o nome do técnico.', 'err'); return; }
    const data = {
      name, type: document.getElementById('fTecType').value,
      registrationNumber: document.getElementById('fTecReg').value.trim(),
      contact: document.getElementById('fTecContact').value.trim()
    };
    let ok;
    if(tech) ok = await dbUpdate('technicians', tech.id, data);
    else ok = await dbAdd('technicians', data);
    if(ok){ closeModal(); toast('Técnico salvo.', 'ok'); }
  });
}
